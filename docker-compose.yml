# BE 와 함께 로컬에서 띄우기 위한 구성 (#1 #31).
#
#   docker compose up --build
#   curl localhost:8000/health
#
# BE 저장소의 compose 와 같은 네트워크(careercompass)에 두면 `http://ai:8000` 으로 부를 수 있다.
#
# 운영에서는 `ports:` 를 지우고 `expose:` 만 남긴다 — 이 서비스는 BE 만 부른다 (계약 「호출 방식」).
# 인증 헤더가 없으므로 네트워크 경계가 유일한 문이다.

services:
  ai:
    build: .
    image: ghcr.io/team-careercompass/careercompass-ai:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false  # 없으면 스텁 모드로 뜬다
    environment:
      CC_STUB_MODE: ${CC_STUB_MODE:-false}  # .env 에 키가 없으면 어차피 스텁으로 내려간다
    volumes:
      # 예산 장부(.cache/budget.json)와 리플레이 캐시가 컨테이너 재시작에도 남게
      - ai-cache:/srv/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    restart: unless-stopped

volumes:
  ai-cache:

networks:
  default:
    name: careercompass
